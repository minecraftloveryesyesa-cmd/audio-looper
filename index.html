<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AL&G - Loop Player & Arcade Edition</title>

<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AL&G">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
body {
    background: #050508; color: #e5e5ea;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    text-align: center; margin: 0; padding: 0;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; min-height: 100dvh;
    box-sizing: border-box; overflow: hidden; touch-action: none;
}
#particleCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }

/* ☰ メニュー */
.menu-trigger {
    position: fixed; top: 20px; left: 20px; width: 44px; height: 44px;
    background: #15151e; border: 1px solid #222230; border-radius: 12px;
    cursor: pointer; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 5px;
    z-index: 1000; box-shadow: 0 4px 15px rgba(0,0,0,0.4);
}
.menu-trigger span { display: block; width: 22px; height: 2px; background: #e5e5ea; border-radius: 2px; }

/* 📂 サイドメニュー */
.side-drawer {
    position: fixed; top: 0; left: 0; width: 300px; height: 100%;
    background: #0e0e12; border-right: 1px solid #222230; box-shadow: 5px 0 30px rgba(0,0,0,0.8); z-index: 2000;
    display: flex; flex-direction: column; padding: 30px 20px; box-sizing: border-box;
    transform: translate3d(-100%, 0, 0); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}
.side-drawer.open { transform: translate3d(0, 0, 0); }
.drawer-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid #2c2c3e; padding-bottom: 15px; }
.drawer-title { font-size: 18px; font-weight: 800; letter-spacing: 2px; color: #bf5af2; margin: 0; }
.close-btn { background: none; border: none; color: #8e8e93; font-size: 24px; cursor: pointer; }

.game-launch-btn { width: 100%; padding: 14px; color: white; border: none; border-radius: 12px; font-size: 14px; font-weight: bold; cursor: pointer; margin-bottom: 15px; transition: all 0.2s; }
.game-launch-btn.holeio { background: linear-gradient(135deg, #bf5af2, #5e5ce6); }
.game-launch-btn.lastwar { background: linear-gradient(135deg, #ff9f0a, #ff3b30); }
.game-launch-btn.breaker { background: linear-gradient(135deg, #0a84ff, #0055d4); }
.game-launch-btn.puddle { background: linear-gradient(135deg, #5c6b5d, #2e3b2f); text-shadow: 0 0 8px rgba(92,107,93,0.6); display: block !important; }

.drawer-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px); z-index: 1500; opacity: 0; pointer-events: none; transition: opacity 0.4s; }
.drawer-overlay.open { opacity: 1; pointer-events: auto; }

/* ⚡ プレイヤーUI */
.main-container {
    background: linear-gradient(145deg, #0e0e12, #15151e); border: 1px solid #222230; border-radius: 24px;
    padding: 35px 25px; width: 90%; max-width: 420px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7); position: relative; z-index: 10; display: flex; flex-direction: column; gap: 20px;
}
.main-container::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 6px; background: linear-gradient(90deg, #0a84ff, #bf5af2); border-radius: 24px 24px 0 0; }
h1 { font-size: 26px; font-weight: 900; letter-spacing: 4px; margin: 0; background: linear-gradient(135deg, #0a84ff, #bf5af2); -webkit-background-clip: text; background-clip: text; color: transparent; }
input[type="file"] { width: 100%; padding: 14px; font-size: 14px; background: #1c1c24; color: #8e8e93; border: 1px solid #2c2c3e; border-radius: 12px; box-sizing: border-box; }
#playBtn { width: 100%; padding: 16px; font-size: 16px; background: linear-gradient(135deg, #0a84ff, #0055d4); color: white; font-weight: 800; border: none; border-radius: 12px; cursor: pointer; }
.custom-player { background: #09090d; border: 1px solid #2c2c3e; border-radius: 16px; padding: 20px 16px; display: flex; flex-direction: column; gap: 12px; }
.time-display { display: flex; justify-content: space-between; font-family: monospace; font-size: 13px; color: #8e8e93; }
.seekbar-touch-zone { width: 100%; height: 20px; display: flex; align-items: center; position: relative; }
.seekbar-container { width: 100%; height: 6px; background: #1c1c24; border-radius: 3px; position: relative; }
.seekbar-progress { position: absolute; top: 0; left: 0; width: 0%; height: 100%; background: linear-gradient(90deg, #0a84ff, #bf5af2); border-radius: 3px; }
.seekbar-handle { position: absolute; top: 50%; left: 0%; width: 14px; height: 14px; background: #fff; border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 8px #0a84ff; }
.status-monitor { background: #09090d; border: 1px solid #2c2c3e; border-radius: 12px; padding: 12px; }
#status { margin: 0; color: #0a84ff; font-family: monospace; font-size: 12px; font-weight: bold; }

#loadingOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #050508; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; opacity: 0; pointer-events: none; transition: opacity 0.4s; }
#loadingOverlay.active { opacity: 1; pointer-events: auto; }
.spinner { width: 40px; height: 40px; border: 4px solid transparent; border-top: 4px solid #0a84ff; border-right: 4px solid #bf5af2; border-radius: 50%; animation: spin 0.8s infinite linear; }
@keyframes spin { 100% { transform: rotate(360deg); } }

/* 🎮 各種ゲーム画面 */
.game-overlay-screen {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: #09090d; z-index: 3000; display: none;
    flex-direction: column; justify-content: center; align-items: center;
    box-sizing: border-box; touch-action: none;
}
.game-overlay-screen.active { display: flex; }
.game-ui-wrap { text-align: center; width: 100%; max-width: 360px; display: flex; flex-direction: column; align-items: center; position: relative; }
.game-overlay-screen h1 { font-size: 18px; margin: 6px 0; font-family: 'Arial Black', sans-serif; letter-spacing: 1px; }
.canvas-container { position: relative; border-radius: 16px; overflow: hidden; box-shadow: 0 15px 35px rgba(0,0,0,0.7); }
.exit-game-btn { position: absolute; top: 12px; right: 12px; background: rgba(255,59,48,0.9); color: white; border: none; border-radius: 8px; padding: 6px 12px; font-weight: bold; font-size: 11px; z-index: 3100; cursor: pointer; }
.bottom-action-btn { margin-top: 10px; width: 320px; padding: 12px; font-size: 14px; color: #fff; border: 1px solid rgba(255,255,255,0.4); border-radius: 12px; font-weight: bold; cursor: pointer; }

#holeGameCanvas { background: #242836; width: 340px; height: 460px; display: block; }
#lastWarCanvas { background: linear-gradient(180deg, #1c2b18 0%, #0d140c 100%); width: 320px; height: 480px; display: block; }
#breakerCanvas { background: #09090d; width: 340px; height: 380px; display: block; }

/* 🛸 パドルジャンパー専用 */
#puddleCanvas { background: #04060a; width: 340px; height: 370px; display: block; }
.jumper-controls { display: flex; width: 340px; justify-content: center; margin-top: 10px; }
.ctrl-pad { background: linear-gradient(135deg, #6b7c6d, #3a473b); border: 1px solid rgba(255,255,255,0.2); border-radius: 14px; padding: 16px; color: #fff; font-weight: 900; font-size: 15px; width: 100%; letter-spacing: 2px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); touch-action: none; user-select: none; -webkit-user-select: none; }
.ctrl-pad:active { background: linear-gradient(135deg, #4d5a4e, #252e26); }
</style>
</head>
<body>

<canvas id="particleCanvas"></canvas>
<div id="loadingOverlay" class="active"><div class="spinner"></div></div>

<div class="menu-trigger" id="menuTrigger"><span></span><span></span><span></span></div>
<div class="drawer-overlay" id="drawerOverlay"></div>

<div class="side-drawer" id="sideDrawer">
    <div class="drawer-header"><h2 class="drawer-title">AL&G ARCADE</h2><button class="close-btn" id="closeDrawer">&times;</button></div>
    <button class="game-launch-btn holeio" id="launchHoleViewBtn">PLAY HOLE.IO</button>
    <button class="game-launch-btn lastwar" id="launchLastWarViewBtn">PLAY LAST WAR</button>
    <button class="game-launch-btn breaker" id="launchBreakerViewBtn">BLOCK BREAKER</button>
    <button class="game-launch-btn puddle" id="launchPuddleBtn">🛸 PADDLE JUMPER (STAGATE)</button>
</div>

<div class="main-container" id="mainContainer">
    <h1>AL&G LOOPER</h1>
    <div><input type="file" id="picker" accept=".mp3, .wav, .m4a, .aac, audio/*"></div>
    <div><button id="playBtn">PLAY</button></div>
    <div class="custom-player">
        <div class="time-display"><span id="currentTime">00:00</span><span id="durationTime">00:00</span></div>
        <div class="seekbar-touch-zone" id="seekbarTouchZone">
            <div class="seekbar-container">
                <div class="seekbar-progress" id="seekbarProgress"></div>
                <div class="seekbar-handle" id="seekbarHandle"></div>
            </div>
        </div>
    </div>
    <audio id="player" playsinline preload="auto" loop></audio>
    <div class="status-monitor"><p id="status">NO FILE SELECTED</p></div>
</div>

<div class="game-overlay-screen" id="holeGameScreen">
    <div class="game-ui-wrap">
        <button class="exit-game-btn generic-exit">EXIT</button>
        <h1 style="color: #bf5af2;">HOLE.IO 3D-2D</h1>
        <div class="canvas-container" style="border: 3px solid #bf5af2;"><canvas id="holeGameCanvas" width="340" height="460"></canvas></div>
        <button id="startHoleGameBtn" class="bottom-action-btn" style="background: #bf5af2;">START CONSUME</button>
    </div>
</div>

<div class="game-overlay-screen" id="lastWarScreen">
    <div class="game-ui-wrap">
        <button class="exit-game-btn generic-exit">EXIT</button>
        <h1 style="color: #ff9f0a;">LAST WAR: OPERATION</h1>
        <div class="canvas-container" style="border: 3px solid #ff9f0a;"><canvas id="lastWarCanvas" width="320" height="480"></canvas></div>
        <button id="startLastWarBtn" class="bottom-action-btn" style="background: #ff9f0a;">START OPERATION</button>
    </div>
</div>

<div class="game-overlay-screen" id="breakerScreen">
    <div class="game-ui-wrap">
        <button class="exit-game-btn generic-exit">EXIT</button>
        <h1 style="color: #0a84ff;">BLOCK BREAKER</h1>
        <div class="canvas-container" style="border: 3px solid #0a84ff;"><canvas id="breakerCanvas" width="340" height="380"></canvas></div>
        <button id="startBreakerBtn" class="bottom-action-btn" style="background: #0a84ff;">START BREAKING</button>
    </div>
</div>

<div class="game-overlay-screen" id="puddleScreen">
    <div class="game-ui-wrap">
        <button class="exit-game-btn generic-exit">EXIT</button>
        <h1 style="color: #8da390; text-shadow: 0 0 10px rgba(141,163,144,0.5);">🛸 PADDLE JUMPER</h1>
        <div class="canvas-container" style="border: 3px solid #5c6b5d;">
            <canvas id="puddleCanvas" width="340" height="370"></canvas>
        </div>
        <div class="jumper-controls">
            <button class="ctrl-pad" id="btnThrust">✨ DRIVE PODS (外殻ユニット展開)</button>
        </div>
        <p style="font-size:11px; color:#8e8e93; margin:8px 0 0 0;">※スワイプで上下左右に機体が傾きながら移動します</p>
    </div>
</div>


<script>
/* --- 画面遷移管理 --- */
const menuTrigger = document.getElementById("menuTrigger");
const sideDrawer = document.getElementById("sideDrawer");
const drawerOverlay = document.getElementById("drawerOverlay");
const closeDrawer = document.getElementById("closeDrawer");

const holeScreen = document.getElementById("holeGameScreen");
const lastWarScreen = document.getElementById("lastWarScreen");
const breakerScreen = document.getElementById("breakerScreen");
const puddleScreen = document.getElementById("puddleScreen");

menuTrigger.addEventListener("click", () => { sideDrawer.classList.add("open"); drawerOverlay.classList.add("open"); });
const closeMenu = () => { sideDrawer.classList.remove("open"); drawerOverlay.classList.remove("open"); };
closeDrawer.addEventListener("click", closeMenu);
drawerOverlay.addEventListener("click", closeMenu);

document.querySelectorAll(".generic-exit").forEach(btn => {
    btn.addEventListener("click", () => {
        holeScreen.classList.remove("active"); activeHole = false;
        lastWarScreen.classList.remove("active"); activeLW = false;
        breakerScreen.classList.remove("active"); activeBB = false;
        puddleScreen.classList.remove("active"); activePJ = false;
    });
});

document.getElementById("launchHoleViewBtn").addEventListener("click", () => { closeMenu(); holeScreen.classList.add("active"); initHoleGame(); });
document.getElementById("launchLastWarViewBtn").addEventListener("click", () => { closeMenu(); lastWarScreen.classList.add("active"); initLastWar(); });
document.getElementById("launchBreakerViewBtn").addEventListener("click", () => { closeMenu(); breakerScreen.classList.add("active"); initBreaker(); });
document.getElementById("launchPuddleBtn").addEventListener("click", () => { closeMenu(); puddleScreen.classList.add("active"); initPuddleGame(); });


/* ====================================================================
   🕳️ GAME 1: HOLE.IO
   ==================================================================== */
const hCanvas = document.getElementById("holeGameCanvas"), hCtx = hCanvas.getContext("2d"), startHoleBtn = document.getElementById("startHoleGameBtn");
let activeHole = false, scoreHole = 0, timeHole = 60, gameOverHole = false, holeFrame = 0;
let holeObj = { x: 170, y: 320, r: 18, targetR: 18, speed: 3.5 };
let gameObjects = [];
let touchStartPos = null, touchCurrentPos = null;

function initHoleGame() {
    scoreHole = 0; timeHole = 60; gameOverHole = false; holeFrame = 0;
    holeObj.x = 170; holeObj.y = 320; holeObj.r = 18; holeObj.targetR = 18;
    gameObjects = []; activeHole = true; startHoleBtn.textContent = "RESET CITY";
    for(let i=0; i<40; i++) spawnCityObject(true);
}
function spawnCityObject(isInit = false) {
    const types = [{w:6,h:12,s:10,c:'#ffcc00'}, {w:18,h:10,s:35,c:'#ff9f0a'}, {w:24,h:22,s:120,c:'#30d158'}, {w:40,h:90,s:300,c:'#bf5af2'}];
    let t = types[Math.floor(Math.random()*types.length)];
    gameObjects.push({ x: Math.random()*300+20, y: isInit?Math.random()*380+50:-40, w: t.w, h: t.h, score: t.s, color: t.c, sucked: false, scale: 1.0, z: 0 });
}
hCanvas.addEventListener("touchstart", (e) => {
    let t = e.touches[0], r = hCanvas.getBoundingClientRect();
    touchStartPos = { x: t.clientX - r.left, y: t.clientY - r.top }; touchCurrentPos = {...touchStartPos};
}, {passive:true});
hCanvas.addEventListener("touchmove", (e) => {
    if(!touchStartPos) return; let t = e.touches[0], r = hCanvas.getBoundingClientRect();
    touchCurrentPos = { x: t.clientX - r.left, y: t.clientY - r.top };
}, {passive:true});
hCanvas.addEventListener("touchend", () => { touchStartPos = null; });

function updateHolePhysics() {
    if(!activeHole || gameOverHole) return; holeFrame++;
    if(holeFrame%60===0 && timeHole>0) { timeHole--; if(timeHole<=0) gameOverHole=true; }
    if(holeObj.r < holeObj.targetR) holeObj.r += 0.2;
    if(touchStartPos && touchCurrentPos) {
        let dx = touchCurrentPos.x - touchStartPos.x, dy = touchCurrentPos.y - touchStartPos.y;
        if(Math.hypot(dx,dy)>5) { holeObj.x += Math.cos(Math.atan2(dy,dx))*3; holeObj.y += Math.sin(Math.atan2(dy,dx))*2.5; }
    }
    if(gameObjects.length < 40) spawnCityObject(false);
    gameObjects.forEach((obj, i) => {
        if(!obj.sucked) {
            obj.y += 0.4; if(obj.y > 480) gameObjects.splice(i,1);
            if(Math.hypot(obj.x-holeObj.x, (obj.y-holeObj.y)*1.3) < holeObj.r) obj.sucked = true;
        } else {
            obj.x += (holeObj.x - obj.x)*0.2; obj.y += (holeObj.y - obj.y)*0.2; obj.scale -= 0.08; obj.z += 3;
            if(obj.scale <= 0) { scoreHole += obj.score; holeObj.targetR += 1; gameObjects.splice(i,1); }
        }
    });
}
function drawHoleGame() {
    hCtx.clearRect(0,0,340,460); hCtx.fillStyle="rgba(255,255,255,0.05)";
    for(let i=0; i<340; i+=40) hCtx.fillRect(i,0,1,460);
    hCtx.fillStyle="#09090d"; hCtx.strokeStyle="#bf5af2"; hCtx.lineWidth=3;
    hCtx.beginPath(); hCtx.ellipse(holeObj.x, holeObj.y*0.8, holeObj.r, holeObj.r*0.7, 0, 0, Math.PI*2); hCtx.fill(); hCtx.stroke();
    gameObjects.forEach(o => {
        hCtx.save(); hCtx.translate(o.x, o.y*0.8 + o.z); hCtx.fillStyle=o.color;
        hCtx.fillRect(-o.w*o.scale/2, -o.h*o.scale, o.w*o.scale, o.h*o.scale); hCtx.restore();
    });
    hCtx.fillStyle="#ffcc00"; hCtx.font="bold 14px sans-serif"; hCtx.fillText("⏱️ "+timeHole+"s", 15, 30);
    hCtx.fillText("SCORE: "+scoreHole, 240, 30);
}
startHoleBtn.addEventListener("click", () => initHoleGame());


/* ====================================================================
   🔥 GAME 2: LAST WAR
   ==================================================================== */
const lwCanvas = document.getElementById("lastWarCanvas"), lwCtx = lwCanvas.getContext("2d"), startLwBtn = document.getElementById("startLastWarBtn");
let activeLW = false, scoreLW = 0, soldierCount = 5, lwFrame = 0, gameOverLW = false, playerX = 160;
let bullets = [], enemies = [], gates = [];

function initLastWar() {
    scoreLW=0; soldierCount=5; lwFrame=0; gameOverLW=false; playerX=160; bullets=[]; enemies=[]; gates=[]; activeLW=true;
    gates.push({x:10, y:-100, w:140, type:'add', v:5}, {x:170, y:-100, w:140, type:'mult', v:2});
}
lwCanvas.addEventListener("touchmove", (e) => {
    let r = lwCanvas.getBoundingClientRect(); playerX = (e.touches[0].clientX - r.left) * (320/r.width);
}, {passive:true});

function updateLastWar() {
    if(!activeLW || gameOverLW) return; lwFrame++;
    if(lwFrame%10===0) bullets.push({x:playerX, y:420});
    bullets.forEach((b,i)=> { b.y -= 7; if(b.y<-10) bullets.splice(i,1); });
    gates.forEach(g => {
        g.y += 1.5; if(g.y > 500) { g.y = -120; g.v = Math.random()>0.5?4:2; }
        if(g.y>410 && g.y<430 && playerX>g.x && playerX<g.x+g.w) {
            soldierCount = g.type==='add'?soldierCount+g.v : soldierCount*g.v; g.y = -200;
        }
    });
    if(lwFrame%40===0) enemies.push({x:Math.random()*280+20, y:-20, hp:3});
    enemies.forEach((e,i)=> {
        e.y += 1.5; if(e.y>450) gameOverLW=true;
        bullets.forEach((b,bi)=> { if(Math.hypot(b.x-e.x, b.y-e.y)<15) { e.hp--; bullets.splice(bi,1); if(e.hp<=0) { enemies.splice(i,1); scoreLW+=10; } } });
    });
}
function drawLastWar() {
    lwCtx.clearRect(0,0,320,480);
    gates.forEach(g => { lwCtx.fillStyle="rgba(0,120,255,0.6)"; lwCtx.fillRect(g.x,g.y,g.w,30); lwCtx.fillStyle="#fff"; lwCtx.fillText((g.type==='add'?'+':'x')+g.v, g.x+g.w/2-10, g.y+20); });
    lwCtx.fillStyle="#ffcc00"; bullets.forEach(b=>lwCtx.fillRect(b.x-2,b.y,4,10));
    lwCtx.fillStyle="#ff3b30"; enemies.forEach(e=>lwCtx.beginPath(lwCtx.arc(e.x,e.y,10,0,Math.PI*2,lwCtx.fill())));
    lwCtx.fillStyle="#00f2fe"; lwCtx.fillText("👥 "+soldierCount, playerX-15, 440);
    lwCtx.fillStyle="#fff"; lwCtx.fillText("SCORE: "+scoreLW, 10, 25);
}
startLwBtn.addEventListener("click", () => initLastWar());


/* ====================================================================
   🧱 GAME 3: BLOCK BREAKER
   ==================================================================== */
const bCanvas = document.getElementById("breakerCanvas"), bCtx = bCanvas.getContext("2d"), startBbBtn = document.getElementById("startBreakerBtn");
let activeBB = false, bx, by, bdx, bdy, bpX, bricks = [], scoreBB = 0, gameOverBB = false;

function initBreaker() {
    bx=170; by=320; bdx=2; bdy=-3; bpX=135; scoreBB=0; gameOverBB=false; activeBB=true;
    for(let i=0; i<6; i++) { bricks[i]=[]; for(let j=0; j<4; j++) bricks[i][j]=1; }
}
bCanvas.addEventListener("touchmove", (e) => {
    let r = bCanvas.getBoundingClientRect(); bpX = (e.touches[0].clientX - r.left)*(340/r.width) - 35;
}, {passive:true});

function updateBreaker() {
    if(!activeBB || gameOverBB) return;
    bx+=bdx; by+=bdy; if(bx<5||bx>335) bdx=-bdx; if(by<5) bdy=-bdy;
    if(by>340 && bx>bpX && bx<bpX+70) bdy=-3; if(by>370) gameOverBB=true;
    for(let i=0; i<6; i++){
        for(let j=0; j<4; j++){
            if(bricks[i][j]===1){
                let x=i*50+20, y=j*20+40;
                if(bx>x && bx<x+45 && by>y && by<y+15) { bdy=-bdy; bricks[i][j]=0; scoreBB++; }
            }
        }
    }
}
function drawBreaker() {
    bCtx.clearRect(0,0,340,380); bCtx.fillStyle="#0a84ff"; bCtx.fillRect(bpX, 350, 70, 10);
    bCtx.fillStyle="#bf5af2"; bCtx.beginPath(); bCtx.arc(bx,by,6,0,Math.PI*2); bCtx.fill();
    for(let i=0; i<6; i++){ for(let j=0; j<4; j++) { if(bricks[i][j]===1){ bCtx.fillStyle="#30d158"; bCtx.fillRect(i*50+20, j*20+40, 45, 15); } } }
    bCtx.fillStyle="#fff"; bCtx.fillText("SCORE: "+scoreBB, 15,25);
}
startBbBtn.addEventListener("click", () => initBreaker());


/* ====================================================================
   🛸 GAME 4: PADDLE JUMPER (スターゲイト機体完全再現・2.5Dフライト)
   ==================================================================== */
const pCanvas = document.getElementById("puddleCanvas"), pCtx = pCanvas.getContext("2d");
let activePJ = false, scorePJ = 0, energyPJ = 100, gameOverPJ = false, pjFrame = 0;

let ship3D = { x: 0, y: 0, rotX: 0, rotY: 0, rotZ: 0 }; 
let targetShip = { x: 0, y: 0, rotX: 0, rotY: 0 };
let star3D = [], objects3D = [], particles = [];
let isThrusting = false;
let podExtension = 0.0; // ドライブポッド展開アニメーション用
let pjTouchStart = null;

function initPuddleGame() {
    scorePJ = 0; energyPJ = 100; gameOverPJ = false; activePJ = true; pjFrame = 0;
    ship3D = { x: 0, y: 0, rotX: 0, rotY: 0, rotZ: 0 };
    targetShip = { x: 0, y: 0, rotX: 0, rotY: 0 };
    star3D = []; objects3D = []; particles = []; isThrusting = false; podExtension = 0.0;

    // ワームホール通過をイメージしたスターダスト
    for(let i=0; i<80; i++) {
        star3D.push({ x: (Math.random()-0.5)*1200, y: (Math.random()-0.5)*1200, z: Math.random()*800 + 50, s: Math.random()*2+1 });
    }
    // 初期のスターゲイトを配置
    spawnPJObject('stargate', 0, 0, 700);
}

function spawnPJObject(type, x, y, z) {
    objects3D.push({ type: type, x: x, y: y, z: z, r: type==='stargate'? 90 : 25 });
}

// 直感的なスワイプ追従コントロール
pCanvas.addEventListener("touchstart", (e) => {
    if(!activePJ || gameOverPJ) return;
    let t = e.touches[0]; pjTouchStart = { x: t.clientX, y: t.clientY, baseShipX: ship3D.x, baseShipY: ship3D.y };
}, {passive:true});

pCanvas.addEventListener("touchmove", (e) => {
    if(!activePJ || gameOverPJ || !pjTouchStart) return;
    let t = e.touches[0];
    let dx = t.clientX - pjTouchStart.x;
    let dy = t.clientY - pjTouchStart.y;

    targetShip.x = Math.max(-130, Math.min(130, pjTouchStart.baseShipX + dx * 0.7));
    targetShip.y = Math.max(-100, Math.min(100, pjTouchStart.baseShipY + dy * 0.7));
    targetShip.rotZ = dx * 0.002;  
    targetShip.rotX = dy * 0.002; 
}, {passive:true});

pCanvas.addEventListener("touchend", () => {
    targetShip.rotZ = 0; targetShip.rotX = 0;
    pjTouchStart = null;
});

// ドライブポッド展開ボタンのトリガー
const thrustBtn = document.getElementById("btnThrust");
['touchstart', 'mousedown'].forEach(evt => {
    thrustBtn.addEventListener(evt, (e) => { e.preventDefault(); if(activePJ) isThrusting = !isThrusting; });
});

function updatePuddlePhysics() {
    if(!activePJ || gameOverPJ) return;
    pjFrame++;

    // 位置と傾きのイージング追従
    ship3D.x += (targetShip.x - ship3D.x) * 0.1;
    ship3D.y += (targetShip.y - ship3D.y) * 0.1;
    ship3D.rotZ += ((targetShip.rotZ || 0) - ship3D.rotZ) * 0.1;
    ship3D.rotX += ((targetShip.rotX || 0) - ship3D.rotX) * 0.1;

    // ドライブポッド展開アニメーションのスムーズ化
    if(isThrusting) {
        podExtension += (1.0 - podExtension) * 0.1;
    } else {
        podExtension += (0.0 - podExtension) * 0.1;
    }

    let speed = isThrusting ? 15.0 : 7.0;

    let camX = ship3D.x * 0.05;
    let camY = ship3D.y * 0.05;

    // 宇宙空間の移動
    star3D.forEach(s => {
        s.z -= speed; s.x -= camX; s.y -= camY;
        if(s.z <= 10) { s.x = (Math.random()-0.5)*1200; s.y = (Math.random()-0.5)*1200; s.z = 800; }
    });

    // 障害物・ゲイトの移動処理
    for(let i=objects3D.length-1; i>=0; i--) {
        let o = objects3D[i]; o.z -= speed; o.x -= camX; o.y -= camY;

        // 衝突判定（機体付近を通過した時）
        if(o.z <= 35 && o.z > 0) {
            let dist = Math.hypot(o.x - ship3D.x, o.y - ship3D.y);
            if(dist < o.r + 20) {
                if(o.type === 'stargate') {
                    scorePJ += 1000; energyPJ = Math.min(100, energyPJ + 15);
                    // 通過エフェクト粒子
                    for(let p=0; p<15; p++) particles.push({x: ship3D.x, y: ship3D.y, z: 40, vx:(Math.random()-0.5)*10, vy:(Math.random()-0.5)*10, life:30});
                } else {
                    energyPJ -= 20;
                }
                objects3D.splice(i,1);
            }
        } else if(o.z <= 0) {
            objects3D.splice(i,1);
        }
    }

    // パーティクル更新
    for(let i=particles.length-1; i>=0; i--) {
        let p = particles[i]; p.z -= speed * 0.5; p.x += p.vx; p.y += p.vy; p.life--;
        if(p.life <= 0) particles.splice(i,1);
    }

    // 次のゲイトやデブリの生成
    if(objects3D.length < 3) {
        if(Math.random() > 0.4) spawnPJObject('debris', (Math.random()-0.5)*400, (Math.random()-0.5)*400, 800);
        else spawnPJObject('stargate', (Math.random()-0.5)*150, (Math.random()-0.5)*150, 800);
    }

    if(energyPJ <= 0) { energyPJ = 0; gameOverPJ = true; }
}

function project(x, y, z, cx, cy) {
    let fov = 240; if(z <= 0) z = 1;
    return { x: (x / z) * fov + cx, y: (y / z) * fov + cy, scale: fov / z };
}

function drawPuddleGame() {
    pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
    let cx = pCanvas.width / 2, cy = pCanvas.height / 2;

    // 背景星々
    pCtx.fillStyle = "rgba(255, 255, 255, 0.7)";
    star3D.forEach(s => {
        let pt = project(s.x, s.y, s.z, cx, cy);
        if(pt.x >= 0 && pt.x <= pCanvas.width && pt.y >= 0 && pt.y <= pCanvas.height) {
            pCtx.fillRect(pt.x, pt.y, s.s, s.s);
        }
    });

    // 粒子群の描画
    particles.forEach(p => {
        let pt = project(p.x, p.y, p.z, cx, cy);
        pCtx.fillStyle = `rgba(0, 210, 255, ${p.life/30})`;
        pCtx.fillRect(pt.x, pt.y, pt.scale*0.5, pt.scale*0.5);
    });

    // 3Dオブジェクト描画
    objects3D.sort((a,b)=>b.z - a.z).forEach(o => {
        let pt = project(o.x, o.y, o.z, cx, cy); let sz = o.r * pt.scale * 0.5;
        if(pt.x < -150 || pt.x > pCanvas.width+150 || pt.y < -150 || pt.y > pCanvas.height+150) return;

        if(o.type === 'stargate') {
            // スターゲイトの巨大なリングを再現
            pCtx.strokeStyle = "#43525c"; pCtx.lineWidth = Math.max(3, pt.scale * 0.5);
            pCtx.beginPath(); pCtx.arc(pt.x, pt.y, sz, 0, Math.PI*2); pCtx.stroke();
            // イベントホライズン（内側の青いモヤ）
            let grad = pCtx.createRadialGradient(pt.x, pt.y, 0, pt.x, pt.y, sz);
            grad.addColorStop(0, "rgba(0, 110, 220, 0.5)");
            grad.addColorStop(0.8, "rgba(0, 230, 255, 0.3)");
シェーディング         grad.addColorStop(1, "rgba(0, 40, 80, 0.0)");
            pCtx.fillStyle = grad; pCtx.fill();
            // シェブロン（外枠の赤い固定鍵パーツ）
            pCtx.fillStyle = "#ff5b05";
            for(let a=0; a<Math.PI*2; a+=Math.PI/4) {
                pCtx.fillRect(pt.x + Math.cos(a)*sz - 4, pt.y + Math.sin(a)*sz - 4, 8, 8);
            }
        } else {
            // 宇宙デブリ・アステロイド
            pCtx.fillStyle = "#2d241e"; pCtx.strokeStyle = "#473a32"; pCtx.lineWidth = 1.5;
            pCtx.beginPath();
            for(let a=0; a<Math.PI*2; a+=Math.PI/3) {
                let r = sz * (0.8 + Math.sin(a*3 + o.z)*0.2);
                let px = pt.x + Math.cos(a)*r, py = pt.y + Math.sin(a)*r;
                if(a===0) pCtx.moveTo(px,py); else pCtx.lineTo(px,py);
            }
            pCtx.closePath(); pCtx.fill(); pCtx.stroke();
        }
    });

    // 🛸 スターゲイトのパドルジャンパー本体を描画
    drawStargateJumper(cx, cy);

    // UIオーバーレイ
    pCtx.fillStyle = "#8da390"; pCtx.font = "bold 12px monospace"; pCtx.textAlign = "left";
    pCtx.fillText("🛸 PADDLE JUMPER SYSTEM", 15, 25);
    pCtx.fillStyle = isThrusting ? "#00f2fe" : "#8da390";
    pCtx.fillText("⚙️ DRIVE PODS: " + (isThrusting ? "ENGAGED" : "RETRACTED"), 15, 43);

    pCtx.fillStyle = "#fff"; pCtx.textAlign = "right"; pCtx.fillText("SCORE: " + scorePJ, pCanvas.width - 15, 25);
    
    // シールド耐久度バー表示
    pCtx.fillStyle = "rgba(255,255,255,0.1)"; pCtx.fillRect(15, 55, 100, 6);
    pCtx.fillStyle = energyPJ > 30 ? "#30d158" : "#ff3b30"; pCtx.fillRect(15, 55, energyPJ, 6);

    if(gameOverPJ) {
        pCtx.fillStyle = "rgba(5,7,12,0.95)"; pCtx.fillRect(0,0,pCanvas.width,pCanvas.height);
        pCtx.font = "bold 16px sans-serif"; pCtx.textAlign = "center"; pCtx.fillStyle = "#ff3b30";
        pCtx.fillText("HULL CRITICAL / GAME OVER", pCanvas.width/2, pCanvas.height/2);
    }
}

// 🎨 アップロード画像をピクセル比・グラデーション・構造レベルで精密再現する描画エンジン
function drawStargateJumper(cx, cy) {
    let baseZ = 35;
    let pt = project(ship3D.x, ship3D.y + 10, baseZ, cx, cy); 
    let scale = pt.scale * 0.42; 

    pCtx.save();
    pCtx.translate(pt.x, pt.y);
    pCtx.rotate(ship3D.rotZ);
    // 上下のピッチ傾きを機体に反映
    pCtx.transform(1, 0, 0, 1 - Math.abs(ship3D.rotX), 0, 0);

    // 画像カラーパレット：完全な金属オリーブ・ゴールドグリーン質感
    let colorBodyDark = "#29332a";   // シャドウ部・パネルの彫り込み溝
    let colorBodyBase = "#4a594c";   // 基本となるくすんだオリーブグリーン
    let colorBodyLight = "#697a6b";  // 上部のハイライト金属色
    let colorWindowFrame = "#524b3e"; // 窓枠のゴールドブロンズ色の縁
    let colorInside = "#131714";      // コックピット内部の暗がり
    let colorPodUnit = "#3d473f";    // 左右ユニット

    // --- 1. 機体メインシリンダー（円筒形の本体）のカプセル描画 ---
    // 外郭の丸みグラデーションを再現
    let bodyGrad = pCtx.createLinearGradient(-35 * scale, 0, 35 * scale, 0);
    bodyGrad.addColorStop(0, colorBodyDark);
    bodyGrad.addColorStop(0.2, colorBodyBase);
    bodyGrad.addColorStop(0.5, colorBodyLight);
    bodyGrad.addColorStop(0.8, colorBodyBase);
    bodyGrad.addColorStop(1, colorBodyDark);

    pCtx.fillStyle = bodyGrad;
    pCtx.strokeStyle = colorBodyDark;
    pCtx.lineWidth = 1.5;

    // 前面を丸く、後ろを円筒にした特徴的なシェイプをパスで生成
    pCtx.beginPath();
    pCtx.moveTo(-32 * scale, 15 * scale); // 左下
    pCtx.lineTo(-32 * scale, -10 * scale); // 左側面
    pCtx.bezierCurveTo(-32 * scale, -32 * scale, 32 * scale, -32 * scale, 32 * scale, -10 * scale); // 上部円弧
    pCtx.lineTo(32 * scale, 15 * scale); // 右側面
    pCtx.closePath();
    pCtx.fill();
    pCtx.stroke();

    // --- 2. 画像にある表面のメカニカルなパネルライン（幾何学的な細い溝）の再現 ---
    pCtx.strokeStyle = "rgba(20, 30, 22, 0.45)";
    pCtx.lineWidth = 1;
    // 縦方向のライン
    pCtx.beginPath();
    pCtx.moveTo(-20 * scale, -24 * scale); pCtx.lineTo(-20 * scale, 15 * scale);
    pCtx.moveTo(20 * scale, -24 * scale); pCtx.lineTo(20 * scale, 15 * scale);
    // 横方向の分割ライン
    pCtx.moveTo(-32 * scale, -5 * scale); pCtx.lineTo(32 * scale, -5 * scale);
    pCtx.moveTo(-32 * scale, 5 * scale); pCtx.lineTo(32 * scale, 5 * scale);
    pCtx.stroke();

    // --- 3. 正面の斜めカットされた巨大な窓枠 ＆ コックピット内部 ---
    // 窓の外輪郭（ブロンズ色の傾斜フレーム）
    pCtx.fillStyle = colorWindowFrame;
    pCtx.beginPath();
    pCtx.moveTo(-24 * scale, 10 * scale);
    pCtx.lineTo(-24 * scale, -5 * scale);
    pCtx.bezierCurveTo(-24 * scale, -22 * scale, 24 * scale, -22 * scale, 24 * scale, -5 * scale);
    pCtx.lineTo(24 * scale, 10 * scale);
    pCtx.closePath();
    pCtx.fill();

    // 窓の内側（コックピット内の空間）
    pCtx.fillStyle = colorInside;
    pCtx.beginPath();
    pCtx.moveTo(-21 * scale, 8 * scale);
    pCtx.lineTo(-21 * scale, -4 * scale);
    pCtx.bezierCurveTo(-21 * scale, -19 * scale, 21 * scale, -19 * scale, 21 * scale, -4 * scale);
    pCtx.lineTo(21 * scale, 8 * scale);
    pCtx.closePath();
    pCtx.fill();

    // 窓からうっすら見えるシートやクルー（ドット状の内部ディテール）
    pCtx.fillStyle = "#333b35";
    pCtx.fillRect(-12 * scale, -2 * scale, 5 * scale, 6 * scale); // パイロット席
    pCtx.fillRect(7 * scale, -2 * scale, 5 * scale, 6 * scale);  // コ・パイロット席
    pCtx.fillStyle = "rgba(0, 255, 150, 0.4)"; // コンソールの緑の光のシミュレート
    pCtx.fillRect(-5 * scale, 2 * scale, 3 * scale, 2 * scale);
    pCtx.fillRect(2 * scale, 2 * scale, 3 * scale, 2 * scale);

    // --- 4. 左右の可動式ドライブポッド（外殻エンジンユニット） ---
    // アニメーション変数 podExtension（0.0〜1.0）に応じて横にせり出す
    let extOffset = podExtension * 12 * scale;

    pCtx.fillStyle = colorPodUnit;
    pCtx.strokeStyle = colorBodyDark;
    
    // 左側ドライブポッド
    pCtx.save();
    pCtx.translate(-32 * scale - extOffset, 0);
    pCtx.beginPath();
    pCtx.moveTo(0, -10 * scale);
    pCtx.lineTo(-6 * scale, -5 * scale);
    pCtx.lineTo(-6 * scale, 12 * scale);
    pCtx.lineTo(0, 8 * scale);
    pCtx.closePath();
    pCtx.fill(); pCtx.stroke();
    // ポッド内の黄色い発光スリット
    if(isThrusting) {
        pCtx.fillStyle = `rgba(255, 180, 0, ${0.7 + Math.sin(pjFrame*0.5)*0.3})`;
        pCtx.fillRect(-4 * scale, -2 * scale, 2 * scale, 10 * scale);
    }
    pCtx.restore();

    // 右側ドライブポッド
    pCtx.save();
    pCtx.translate(32 * scale + extOffset, 0);
    pCtx.beginPath();
    pCtx.moveTo(0, -10 * scale);
    pCtx.lineTo(6 * scale, -5 * scale);
    pCtx.lineTo(6 * scale, 12 * scale);
    pCtx.lineTo(0, 8 * scale);
    pCtx.closePath();
    pCtx.fill(); pCtx.stroke();
    // ポッド内の黄色い発光スリット
    if(isThrusting) {
        pCtx.fillStyle = `rgba(255, 180, 0, ${0.7 + Math.sin(pjFrame*0.5)*0.3})`;
        pCtx.fillRect(2 * scale, -2 * scale, 2 * scale, 10 * scale);
    }
    pCtx.restore();

    // 駆動時（ポッド展開時）の青白い後方排気エフェクト
    if(isThrusting && podExtension > 0.8) {
        let fl = 15 + Math.sin(pjFrame) * 4;
        let pGrad = pCtx.createLinearGradient(0, 10 * scale, 0, (10 + fl) * scale);
        pGrad.addColorStop(0, "rgba(0, 190, 255, 0.7)");
        pGrad.addColorStop(1, "rgba(0, 80, 255, 0)");
        pCtx.fillStyle = pGrad;
        pCtx.fillRect(-37 * scale, 10 * scale, 4 * scale, fl * scale);
        pCtx.fillRect(33 * scale, 10 * scale, 4 * scale, fl * scale);
    }

    pCtx.restore();
}


/* ====================================================================
   🔄 メインループとオーディオルーパー統合
   ==================================================================== */
function masterGameLoop() {
    if (activeHole) { updateHolePhysics(); drawHoleGame(); }
    if (activeLW) { updateLastWar(); drawLastWar(); }
    if (activeBB) { updateBreaker(); drawBreaker(); }
    if (activePJ) { updatePuddlePhysics(); drawPuddleGame(); }
    requestAnimationFrame(masterGameLoop);
}
masterGameLoop();

const picker = document.getElementById("picker"), player = document.getElementById("player"), statusEl = document.getElementById("status");
const playBtn = document.getElementById("playBtn"), seekbarProgress = document.getElementById("seekbarProgress"), seekbarHandle = document.getElementById("seekbarHandle");
const currentTimeEl = document.getElementById("currentTime"), durationTimeEl = document.getElementById("durationTime"), loadingOverlay = document.getElementById("loadingOverlay");
let currentUrl = null;

window.addEventListener("load", () => { setTimeout(() => { loadingOverlay.classList.remove("active"); }, 400); });

picker.addEventListener("change", () => {
    const file = picker.files[0]; if(!file) return;
    if(currentUrl) URL.revokeObjectURL(currentUrl); currentUrl = URL.createObjectURL(file);
    player.src = currentUrl; player.load(); statusEl.textContent = file.name.toUpperCase();
    player.addEventListener("loadedmetadata", () => { durationTimeEl.textContent = formatTime(player.duration); }, {once:true});
});

playBtn.addEventListener("click", () => { if(!player.src) return; if(player.paused) { player.play(); playBtn.textContent = "PAUSE"; } else { player.pause(); playBtn.textContent = "PLAY"; } });
function formatTime(s) { if(isNaN(s)) return "00:00"; let m=Math.floor(s/60), sec=Math.floor(s%60); return String(m).padStart(2,'0')+":"+String(sec).padStart(2,'0'); }
player.addEventListener("timeupdate", () => { currentTimeEl.textContent = formatTime(player.currentTime); let pct = (player.currentTime/player.duration)*100; seekbarProgress.style.width = pct+"%"; seekbarHandle.style.left = pct+"%"; });

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(err => console.log(err)); });
}
</script>
