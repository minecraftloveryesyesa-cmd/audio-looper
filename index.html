<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AL&G - Loop Player & Arcade Premium</title>

<style>
body {
    background: #050508; color: #e5e5ea;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    text-align: center; margin: 0; padding: 0;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; min-height: 100dvh;
    box-sizing: border-box; overflow: hidden; touch-action: none;
}

/* ☰ メニュー */
.menu-trigger {
    position: fixed; top: 20px; left: 20px; width: 44px; height: 44px;
    background: #15151e; border: 1px solid #222230; border-radius: 12px;
    cursor: pointer; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 5px;
    z-index: 1000; box-shadow: 0 4px 15px rgba(0,0,0,0.4);
}
.menu-trigger span { display: block; width: 22px; height: 2px; background: #e5e5ea; border-radius: 2px; }

/* 📂 サイドメニュー */
.side-drawer {
    position: fixed; top: 0; left: 0; width: 300px; height: 100%;
    background: #0e0e12; border-right: 1px solid #222230; box-shadow: 5px 0 30px rgba(0,0,0,0.8); z-index: 2000;
    display: flex; flex-direction: column; padding: 30px 20px; box-sizing: border-box;
    transform: translate3d(-100%, 0, 0); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}
.side-drawer.open { transform: translate3d(0, 0, 0); }
.drawer-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid #2c2c3e; padding-bottom: 15px; }
.drawer-title { font-size: 18px; font-weight: 800; letter-spacing: 2px; color: #bf5af2; margin: 0; }
.close-btn { background: none; border: none; color: #8e8e93; font-size: 24px; cursor: pointer; }

.game-launch-btn { width: 100%; padding: 14px; color: white; border: none; border-radius: 12px; font-size: 14px; font-weight: bold; cursor: pointer; margin-bottom: 15px; transition: all 0.2s; }
.game-launch-btn.holeio { background: linear-gradient(135deg, #bf5af2, #5e5ce6); }
.game-launch-btn.lastwar { background: linear-gradient(135deg, #ff9f0a, #ff3b30); }
.game-launch-btn.breaker { background: linear-gradient(135deg, #0a84ff, #0055d4); }
.game-launch-btn.puddle { background: linear-gradient(135deg, #5c6b5d, #2e3b2f); }

.drawer-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px); z-index: 1500; opacity: 0; pointer-events: none; transition: opacity 0.4s; }
.drawer-overlay.open { opacity: 1; pointer-events: auto; }

/* ⚡ メインオーディオプレイヤーUI */
.main-container {
    background: linear-gradient(145deg, #0e0e12, #15151e); border: 1px solid #222230; border-radius: 24px;
    padding: 35px 25px; width: 90%; max-width: 420px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7); position: relative; z-index: 10; display: flex; flex-direction: column; gap: 20px;
}
.main-container::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 6px; background: linear-gradient(90deg, #0a84ff, #bf5af2); border-radius: 24px 24px 0 0; }
h1 { font-size: 26px; font-weight: 900; letter-spacing: 4px; margin: 0; background: linear-gradient(135deg, #0a84ff, #bf5af2); -webkit-background-clip: text; background-clip: text; color: transparent; }
input[type="file"] { width: 100%; padding: 14px; font-size: 14px; background: #1c1c24; color: #8e8e93; border: 1px solid #2c2c3e; border-radius: 12px; box-sizing: border-box; }
#playBtn { width: 100%; padding: 16px; font-size: 16px; background: linear-gradient(135deg, #0a84ff, #0055d4); color: white; font-weight: 800; border: none; border-radius: 12px; cursor: pointer; }
.custom-player { background: #09090d; border: 1px solid #2c2c3e; border-radius: 16px; padding: 20px 16px; display: flex; flex-direction: column; gap: 12px; }
.time-display { display: flex; justify-content: space-between; font-family: monospace; font-size: 13px; color: #8e8e93; }
.seekbar-touch-zone { width: 100%; height: 20px; display: flex; align-items: center; position: relative; cursor: pointer; }
.seekbar-container { width: 100%; height: 6px; background: #1c1c24; border-radius: 3px; position: relative; }
.seekbar-progress { position: absolute; top: 0; left: 0; width: 0%; height: 100%; background: linear-gradient(90deg, #0a84ff, #bf5af2); border-radius: 3px; }
.seekbar-handle { position: absolute; top: 50%; left: 0%; width: 14px; height: 14px; background: #fff; border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 8px #0a84ff; }
.status-monitor { background: #09090d; border: 1px solid #2c2c3e; border-radius: 12px; padding: 12px; }
#status { margin: 0; color: #0a84ff; font-family: monospace; font-size: 12px; font-weight: bold; }

/* 🎮 ゲームオーバーレイ */
.game-overlay-screen {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: #09090d; z-index: 3000; display: none;
    flex-direction: column; justify-content: center; align-items: center;
    box-sizing: border-box; touch-action: none;
}
.game-overlay-screen.active { display: flex; }
.game-ui-wrap { text-align: center; width: 100%; max-width: 360px; display: flex; flex-direction: column; align-items: center; position: relative; }
.game-overlay-screen h1 { font-size: 18px; margin: 6px 0; font-family: 'Arial Black', sans-serif; letter-spacing: 1px; }
.canvas-container { position: relative; border-radius: 16px; overflow: hidden; box-shadow: 0 15px 35px rgba(0,0,0,0.7); }
.exit-game-btn { position: absolute; top: 12px; right: 12px; background: rgba(255,59,48,0.9); color: white; border: none; border-radius: 8px; padding: 6px 12px; font-weight: bold; font-size: 11px; z-index: 3100; cursor: pointer; }
.bottom-action-btn { margin-top: 10px; width: 320px; padding: 12px; font-size: 14px; color: #fff; border: 1px solid rgba(255,255,255,0.4); border-radius: 12px; font-weight: bold; cursor: pointer; }

#holeGameCanvas { background: #1a1c24; width: 340px; height: 460px; display: block; }
#lastWarCanvas { background: #9fa8a3; width: 320px; height: 480px; display: block; } /* 背景をアスファルト風グレーに変更 */
#breakerCanvas { background: #07070a; width: 340px; height: 380px; display: block; }
#puddleCanvas { background: #020305; width: 340px; height: 370px; display: block; }

.jumper-controls { display: flex; width: 340px; justify-content: center; margin-top: 10px; }
.ctrl-pad { background: linear-gradient(135deg, #4c594d, #252e26); border: 1px solid rgba(255,255,255,0.2); border-radius: 14px; padding: 16px; color: #fff; font-weight: 900; font-size: 15px; width: 100%; letter-spacing: 2px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); cursor: pointer; }
</style>
</head>
<body>

<div class="menu-trigger" id="menuTrigger"><span></span><span></span><span></span></div>
<div class="drawer-overlay" id="drawerOverlay"></div>

<div class="side-drawer" id="sideDrawer">
    <div class="drawer-header"><h2 class="drawer-title">AL&G ARCADE</h2><button class="close-btn" id="closeDrawer">&times;</button></div>
    
    <div style="margin-bottom: 20px; padding: 12px; background: #15151e; border: 1px solid #222230; border-radius: 12px; text-align: left;">
        <label for="secretCodeInput" style="font-size: 10px; color: #8e8e93; display: block; margin-bottom: 6px; font-weight: bold; letter-spacing: 1px;">SECRET CODE</label>
        <div style="display: flex; gap: 8px;">
            <input type="text" id="secretCodeInput" placeholder="ENTER CODE..." style="flex: 1; padding: 8px; font-size: 12px; background: #09090d; color: #fff; border: 1px solid #2c2c3e; border-radius: 6px; box-sizing: border-box; outline: none;">
            <button id="secretCodeBtn" style="padding: 8px 14px; font-size: 12px; background: #bf5af2; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">OK</button>
        </div>
    </div>

    <button class="game-launch-btn holeio" id="launchHoleViewBtn">PLAY HOLE.IO</button>
    <button class="game-launch-btn lastwar" id="launchLastWarViewBtn">PLAY LAST WAR</button>
    <button class="game-launch-btn breaker" id="launchBreakerViewBtn">BLOCK BREAKER</button>
    <button class="game-launch-btn puddle" id="launchPuddleBtn">🛸 PADDLE JUMPER</button>
</div>

<div class="main-container" id="mainContainer">
    <h1>AL&G LOOPER</h1>
    <div><input type="file" id="picker" accept=".mp3, .wav, .m4a, .aac, audio/*"></div>
    <div><button id="playBtn">PLAY</button></div>
    <div class="custom-player">
        <div class="time-display"><span id="currentTime">00:00</span><span id="durationTime">00:00</span></div>
        <div class="seekbar-touch-zone" id="seekbarTouchZone">
            <div class="seekbar-container">
                <div class="seekbar-progress" id="seekbarProgress"></div>
                <div class="seekbar-handle" id="seekbarHandle"></div>
            </div>
        </div>
    </div>
    <audio id="player" playsinline preload="auto" loop></audio>
    <div class="status-monitor"><p id="status">NO FILE SELECTED</p></div>
</div>

<div class="game-overlay-screen" id="holeGameScreen">
    <div class="game-ui-wrap">
        <button class="exit-game-btn generic-exit">EXIT</button>
        <h1 style="color: #bf5af2;">HOLE.IO 3D-2D</h1>
        <div class="canvas-container" style="border: 3px solid #bf5af2;"><canvas id="holeGameCanvas" width="340" height="460"></canvas></div>
        <button id="startHoleGameBtn" class="bottom-action-btn" style="background: #bf5af2;">START CONSUME</button>
    </div>
</div>

<div class="game-overlay-screen" id="lastWarScreen">
    <div class="game-ui-wrap">
        <button class="exit-game-btn generic-exit">EXIT</button>
        <h1 style="color: #ff9f0a;">LAST WAR: OPERATION</h1>
        <div class="canvas-container" style="border: 3px solid #ff9f0a;"><canvas id="lastWarCanvas" width="320" height="480"></canvas></div>
        <button id="startLastWarBtn" class="bottom-action-btn" style="background: #ff9f0a;">START OPERATION</button>
    </div>
</div>

<div class="game-overlay-screen" id="breakerScreen">
    <div class="game-ui-wrap">
        <button class="exit-game-btn generic-exit">EXIT</button>
        <h1 style="color: #0a84ff;">BLOCK BREAKER</h1>
        <div class="canvas-container" style="border: 3px solid #0a84ff;"><canvas id="breakerCanvas" width="340" height="380"></canvas></div>
        <button id="startBreakerBtn" class="bottom-action-btn" style="background: #0a84ff;">START BREAKING</button>
    </div>
</div>

<div class="game-overlay-screen" id="puddleScreen">
    <div class="game-ui-wrap">
        <button class="exit-game-btn generic-exit">EXIT</button>
        <h1 style="color: #8da390;">🛸 PADDLE JUMPER</h1>
        <div class="canvas-container" style="border: 3px solid #5c6b5d;"><canvas id="puddleCanvas" width="340" height="370"></canvas></div>
        <div class="jumper-controls"><button class="ctrl-pad" id="btnThrust">✨ DRIVE PODS (加速ブースト)</button></div>
    </div>
</div>

<script>
/* ====================================================================
   🔄 画面遷移コントロール & 独立型ループシステム（省電力制限なし）
   ==================================================================== */
const menuTrigger = document.getElementById("menuTrigger"), sideDrawer = document.getElementById("sideDrawer");
const drawerOverlay = document.getElementById("drawerOverlay"), closeDrawer = document.getElementById("closeDrawer");
const holeScreen = document.getElementById("holeGameScreen"), lastWarScreen = document.getElementById("lastWarScreen");
const breakerScreen = document.getElementById("breakerScreen"), puddleScreen = document.getElementById("puddleScreen");

let activeHole = false, activeLW = false, activeBB = false, activePJ = false;

menuTrigger.addEventListener("click", () => { sideDrawer.classList.add("open"); drawerOverlay.classList.add("open"); });
const closeMenu = () => { sideDrawer.classList.remove("open"); drawerOverlay.classList.remove("open"); };
closeDrawer.addEventListener("click", closeMenu);
drawerOverlay.addEventListener("click", closeMenu);

document.querySelectorAll(".generic-exit").forEach(btn => {
    btn.addEventListener("click", () => {
        activeHole = false; activeLW = false; activeBB = false; activePJ = false;
        holeScreen.classList.remove("active"); lastWarScreen.classList.remove("active");
        breakerScreen.classList.remove("active"); puddleScreen.classList.remove("active");
        hCtx.clearRect(0,0,340,460); lwCtx.clearRect(0,0,320,480); bCtx.clearRect(0,0,340,380); pCtx.clearRect(0,0,340,370);
    });
});

document.getElementById("launchHoleViewBtn").addEventListener("click", () => { closeMenu(); holeScreen.classList.add("active"); initHoleGame(); });
document.getElementById("launchLastWarViewBtn").addEventListener("click", () => { closeMenu(); lastWarScreen.classList.add("active"); initLastWar(); });
document.getElementById("launchBreakerViewBtn").addEventListener("click", () => { closeMenu(); breakerScreen.classList.add("active"); initBreaker(); });
document.getElementById("launchPuddleBtn").addEventListener("click", () => { closeMenu(); puddleScreen.classList.add("active"); initPuddleGame(); });


/* ====================================================================
   🕳️ GAME 1: HOLE.IO
   ==================================================================== */
const hCanvas = document.getElementById("holeGameCanvas"), hCtx = hCanvas.getContext("2d"), startHoleBtn = document.getElementById("startHoleGameBtn");
let scoreHole = 0, timeHole = 60, gameOverHole = true, holeFrame = 0;
let holeObj = { x: 170, y: 320, r: 20, targetR: 20 };
let gameObjects = [], touchStartPos = null, touchCurrentPos = null;

function initHoleGame() {
    scoreHole = 0; timeHole = 60; gameOverHole = false; holeFrame = 0;
    holeObj = { x: 170, y: 320, r: 20, targetR: 20 }; gameObjects = [];
    activeHole = true; startHoleBtn.textContent = "RESET CITY";
    for(let i=0; i<45; i++) spawnCityObject(true);
    requestAnimationFrame(holeLoop);
}
function spawnCityObject(isInit = false) {
    const types = [
        {w:12, h:16, s:10,  c:'#ffcc00'}, 
        {w:20, h:28, s:35,  c:'#ff9f0a'}, 
        {w:28, h:45, s:120, c:'#30d158'}, 
        {w:44, h:75, s:300, c:'#bf5af2'}
    ];
    let t = types[Math.floor(Math.random()*types.length)];
    gameObjects.push({ x: Math.random()*300+20, y: isInit?Math.random()*380+40:-60, w: t.w, h: t.h, score: t.s, color: t.c, sucked: false, scale: 1.0 });
}

function handleHoleTouch(clientX, clientY) {
    let r = hCanvas.getBoundingClientRect();
    touchStartPos = { x: clientX - r.left, y: clientY - r.top }; touchCurrentPos = {...touchStartPos};
}
hCanvas.addEventListener("touchstart", (e) => { handleHoleTouch(e.touches[0].clientX, e.touches[0].clientY); }, {passive:true});
hCanvas.addEventListener("touchmove", (e) => {
    if(!touchStartPos) return; let r = hCanvas.getBoundingClientRect();
    touchCurrentPos = { x: e.touches[0].clientX - r.left, y: e.touches[0].clientY - r.top };
}, {passive:true});
hCanvas.addEventListener("touchend", () => { touchStartPos = null; });

function holeLoop() {
    if (!activeHole) return;
    if (!gameOverHole) {
        holeFrame++;
        if(holeFrame%60===0 && timeHole>0) { timeHole--; if(timeHole<=0) gameOverHole=true; }
        if(holeObj.r < holeObj.targetR) holeObj.r += 0.3;
        if(touchStartPos && touchCurrentPos) {
            let dx = touchCurrentPos.x - touchStartPos.x, dy = touchCurrentPos.y - touchStartPos.y;
            if(Math.hypot(dx,dy)>3) { holeObj.x += Math.cos(Math.atan2(dy,dx))*4.5; holeObj.y += Math.sin(Math.atan2(dy,dx))*4.5; }
            holeObj.x = Math.max(15, Math.min(325, holeObj.x)); holeObj.y = Math.max(30, Math.min(430, holeObj.y));
        }
        if(gameObjects.length < 45) spawnCityObject(false);
        for(let i=gameObjects.length-1; i>=0; i--) {
            let obj = gameObjects[i];
            if(!obj.sucked) {
                obj.y += 0.6; if(obj.y > 490) { gameObjects.splice(i,1); continue; }
                if(Math.hypot(obj.x-holeObj.x, obj.y-holeObj.y) < holeObj.r) {
                    if(holeObj.r * 1.3 >= obj.w) obj.sucked = true; 
                }
            } else {
                obj.x += (holeObj.x - obj.x)*0.25; obj.y += (holeObj.y - obj.y)*0.25; obj.scale -= 0.1;
                if(obj.scale <= 0) { scoreHole += obj.score; holeObj.targetR += obj.w*0.12; gameObjects.splice(i,1); }
            }
        }
    }
    
    hCtx.clearRect(0,0,340,460);
    hCtx.fillStyle="#0e1017"; hCtx.beginPath(); hCtx.arc(holeObj.x, holeObj.y, holeObj.r, 0, Math.PI*2); hCtx.fill();
    hCtx.strokeStyle="#bf5af2"; hCtx.lineWidth=3; hCtx.stroke();
    gameObjects.forEach(o => {
        hCtx.save(); hCtx.translate(o.x, o.y); hCtx.fillStyle=o.color;
        hCtx.fillRect(-o.w*o.scale/2, -o.h*o.scale, o.w*o.scale, o.h*o.scale); hCtx.restore();
    });
    hCtx.fillStyle="#ffcc00"; hCtx.font="bold 14px sans-serif"; hCtx.textAlign="left"; hCtx.fillText("⏱️ "+timeHole+"s", 15, 30);
    hCtx.textAlign="right"; hCtx.fillText("SCORE: "+scoreHole, 325, 30);
    if(gameOverHole) { hCtx.fillStyle="rgba(0,0,0,0.8)"; hCtx.fillRect(0,0,340,460); hCtx.fillStyle="#ff3b30"; hCtx.font="bold 20px sans-serif"; hCtx.textAlign="center"; hCtx.fillText("GAME OVER (TIME UP)", 170, 230); }
    
    requestAnimationFrame(holeLoop);
}
startHoleBtn.addEventListener("click", () => initHoleGame());


/* ====================================================================
   🔥 GAME 2: LAST WAR (画像再現・超物量ハクスラ仕様)
   ==================================================================== */
const lwCanvas = document.getElementById("lastWarCanvas"), lwCtx = lwCanvas.getContext("2d"), startLwBtn = document.getElementById("startLastWarBtn");
let scoreLW = 0, soldierCount = 10, lwFrame = 0, gameOverLW = true, playerX = 160;
let bullets = [], enemies = [], gates = [], particles = [];

function initLastWar() {
    scoreLW=0; soldierCount=12; lwFrame=0; gameOverLW=false; playerX=160; bullets=[]; enemies=[]; gates=[]; particles=[]; activeLW=true;
    spawnLwGate(-140); spawnLwGate(-360);
    requestAnimationFrame(lastWarLoop);
}

function spawnLwGate(yPos) {
    // 右側の壁に寄った青い大量追加ゲートのビジュアル再現
    gates.push(
        {x:10,  y:yPos, w:130, type:'add', v:Math.random()>0.5?15:5, active:true},
        {x:160, y:yPos, w:150, type:'add', v:Math.random()>0.5?30:10, active:true} // 青い高倍率ゲートを右側に配置
    );
}

function handleLwMove(clientX) {
    let r = lwCanvas.getBoundingClientRect(); playerX = (clientX - r.left) * (320/r.width);
    playerX = Math.max(25, Math.min(295, playerX));
}
lwCanvas.addEventListener("touchstart", (e) => { handleLwMove(e.touches[0].clientX); }, {passive:true});
lwCanvas.addEventListener("touchmove", (e) => { handleLwMove(e.touches[0].clientX); }, {passive:true});

function lastWarLoop() {
    if (!activeLW) return;
    if (!gameOverLW) {
        lwFrame++;

        // 🚀 画像再現：兵士の密集度に合わせて金色のストリーク弾丸をガガガガッと超高速一斉連射
        if(lwFrame % 3 === 0) { 
            let columns = Math.min(10, Math.ceil(soldierCount / 3)); // 横幅の弾幕数
            let density = soldierCount > 25 ? 2 : 1; // 兵士が多いと2重連射
            for(let d=0; d<density; d++) {
                for(let i=0; i<columns; i++) {
                    let spreadX = playerX + (i - (columns-1)/2) * 6 + (Math.random() - 0.5) * 4;
                    bullets.push({x: spreadX, y: 410 - (d*10)});
                }
            }
        }
        // 金色の縦長ラインレーザー弾の移動
        bullets.forEach((b,i)=> { b.y -= 14; if(b.y<-20) bullets.splice(i,1); });
        
        // ゲート通過処理
        for(let i=0; i<gates.length; i++) {
            let g = gates[i]; g.y += 3.0;
            if(g.active && g.y>400 && g.y<435 && playerX>g.x && playerX<g.x+g.w) {
                soldierCount += g.v;
                let currentY = g.y;
                gates.forEach(item => { if(Math.abs(item.y - currentY) < 15) item.active = false; });
                break;
            }
        }
        if(gates.length > 0 && gates[0].y > 500) { gates.splice(0,2); spawnLwGate(-120); }
        
        // 🧟 画像再現：赤い帽子の敵ゾンビが「超高密度な塊」のウェーブで画面上部を埋め尽くすように出現
        if(lwFrame % 12 === 0) {
            let waveSize = Math.floor(Math.random() * 6) + 8; // 一度に8〜14体まとめて出現
            for(let w=0; w<waveSize; w++) {
                enemies.push({
                    x: Math.random() * 280 + 20, 
                    y: -20 - (Math.random() * 30), 
                    hp: Math.floor(Math.random() * 4) + 2,
                    offsetX: (Math.random() - 0.5) * 0.4
                });
            }
        }

        // 敵の進行と当たり判定（ノックバック＆爆発エフェクト）
        for(let i=enemies.length-1; i>=0; i--) {
            let e = enemies[i]; 
            e.y += 1.4; e.x += e.offsetX; // じわじわと密集しながら進軍
            
            if(e.y > 430) { gameOverLW=true; enemies=[]; return; }
            
            for(let bi=bullets.length-1; bi>=0; bi--) {
                if(Math.abs(bullets[bi].x - e.x) < 14 && Math.abs(bullets[bi].y - e.y) < 16) {
                    e.hp--; 
                    e.y -= 1.5; // 💥 弾が当たると微ノックバック
                    bullets.splice(bi,1);
                    
                    // 💥 画像再現：ヒット時の黄色いフラッシュ・爆発粒子を生成
                    if(Math.random() > 0.3) {
                        particles.push({x: e.x, y: e.y, vx: (Math.random()-0.5)*5, vy: (Math.random()-0.5)*5, size: Math.random()*5+3, alpha: 1.0});
                    }
                    
                    if(e.hp<=0) { 
                        // 盛大な撃破爆発
                        for(let p=0; p<6; p++) {
                            particles.push({x: e.x, y: e.y, vx: (Math.random()-0.5)*7, vy: (Math.random()-0.5)*7, size: Math.random()*6+4, alpha: 1.0});
                        }
                        enemies.splice(i,1); scoreLW+=10; break; 
                    }
                }
            }
        }

        // パーティクルアニメーション
        particles.forEach((p, index) => {
            p.x += p.vx; p.y += p.vy; p.alpha -= 0.08;
            if(p.alpha <= 0) particles.splice(index, 1);
        });
    }
    
    // 背景描写
    lwCtx.fillStyle = "#8a948f"; lwCtx.fillRect(0,0,320,480);
    // ガードレール線（画像の右側フェンス風）
    lwCtx.strokeStyle = "#bcbcbc"; lwCtx.lineWidth = 4; lwCtx.beginPath(); lwCtx.moveTo(310, 0); lwCtx.lineTo(310, 480); lwCtx.stroke();

    // 🟦 青い「＋数字」の計算ゲート（画像右側のレイアウト風に美化）
    gates.forEach(g => { 
        if(!g.active) return;
        lwCtx.fillStyle = "rgba(0, 110, 255, 0.75)"; 
        lwCtx.fillRect(g.x, g.y, g.w, 32); 
        lwCtx.strokeStyle = "#ffffff"; lwCtx.lineWidth = 1.5; lwCtx.strokeRect(g.x, g.y, g.w, 32);
        lwCtx.fillStyle="#fff"; lwCtx.font="bold 15px sans-serif"; 
        lwCtx.fillText("+ " + g.v, g.x + g.w/2 - 12, g.y + 22); 
    });

    // 🚀 画像再現：金色のレーザー風の超高速縦長弾丸
    lwCtx.fillStyle = "#ffdf00";
    bullets.forEach(b => {
        lwCtx.fillStyle = "#ffea70"; lwCtx.fillRect(b.x - 1.5, b.y, 3, 14); // 芯の白い光
        lwCtx.fillStyle = "#ffaa00"; lwCtx.fillRect(b.x - 2.5, b.y + 4, 5, 8);
    });

    // 💥 爆発ヒットエフェクトの描画
    particles.forEach(p => {
        lwCtx.fillStyle = `rgba(255, ${Math.floor(150 + Math.random()*105)}, 0, ${p.alpha})`;
        lwCtx.beginPath(); lwCtx.arc(p.x, p.y, p.size, 0, Math.PI*2); lwCtx.fill();
    });

    // 🧟 画像再現：赤いヘルメット・服を着た超高密度な敵の大群
    enemies.forEach(e=>{ 
        // 体体（赤）
        lwCtx.fillStyle = "#a62424"; lwCtx.beginPath(); lwCtx.arc(e.x, e.y + 4, 11, 0, Math.PI*2); lwCtx.fill(); 
        // ヘルメット（明るい赤）
        lwCtx.fillStyle = "#e63946"; lwCtx.beginPath(); lwCtx.arc(e.x, e.y, 10, 0, Math.PI*2); lwCtx.fill(); 
        // つば部分
        lwCtx.fillRect(e.x - 11, e.y, 22, 2);
    });

    // 👥 画像再現：密集する青いヘルメットの自軍兵士集団
    let sCount = Math.min(30, soldierCount); // 描写上限
    for(let s=0; s<sCount; s++) {
        let row = Math.floor(s / 6);
        let col = s % 6;
        let sx = playerX + (col - 2.5) * 9 + (row % 2 * 4);
        let sy = 440 + row * 8;
        
        // 体（白・ベージュ）
        lwCtx.fillStyle = "#e5cbb3"; lwCtx.fillRect(sx - 5, sy, 10, 10);
        // ズボン（青）
        lwCtx.fillStyle = "#1d3557"; lwCtx.fillRect(sx - 5, sy + 6, 10, 4);
        // 青いヘルメット（丸型）
        lwCtx.fillStyle = "#4ea8de"; lwCtx.beginPath(); lwCtx.arc(sx, sy, 7, 0, Math.PI*2); lwCtx.fill();
        lwCtx.fillStyle = "#0077b6"; lwCtx.beginPath(); lwCtx.arc(sx, sy - 1, 6, 0, Math.PI*2); lwCtx.fill();
    }

    // UI情報
    lwCtx.fillStyle = "#1d3557"; lwCtx.font = "bold 13px sans-serif";
    lwCtx.fillText("👥 自軍戦力: " + soldierCount, 15, 470);
    lwCtx.fillStyle = "#000"; lwCtx.font = "bold 15px monospace"; lwCtx.fillText("SCORE: " + scoreLW, 15, 25);
    
    if(gameOverLW) { 
        lwCtx.fillStyle = "rgba(0,0,0,0.85)"; lwCtx.fillRect(0,0,320,480); 
        lwCtx.fillStyle = "#ff3b30"; lwCtx.font = "bold 24px sans-serif"; lwCtx.fillText("OVERRUN / FAILED", 45, 240); 
    }
    
    requestAnimationFrame(lastWarLoop);
}
startLwBtn.addEventListener("click", () => initLastWar());


/* ====================================================================
   🧱 GAME 3: BLOCK BREAKER
   ==================================================================== */
const bCanvas = document.getElementById("breakerCanvas"), bCtx = bCanvas.getContext("2d"), startBbBtn = document.getElementById("startBreakerBtn");
let bx, by, bdx, bdy, bpX, bricks = [], scoreBB = 0, gameOverBB = true;

function initBreaker() {
    bx=170; by=230; bdx=3.2; bdy=-3.2; bpX=135; scoreBB=0; gameOverBB=false; activeBB=true; bricks=[];
    for(let i=0; i<6; i++) { bricks[i]=[]; for(let j=0; j<4; j++) bricks[i][j]=1; }
    requestAnimationFrame(breakerLoop);
}
function handleBbMove(clientX) {
    let r = bCanvas.getBoundingClientRect(); bpX = (clientX - r.left)*(340/r.width) - 40;
    bpX = Math.max(0, Math.min(260, bpX));
}
bCanvas.addEventListener("touchstart", (e) => { handleBbMove(e.touches[0].clientX); }, {passive:true});
bCanvas.addEventListener("touchmove", (e) => { handleBbMove(e.touches[0].clientX); }, {passive:true});

function breakerLoop() {
    if (!activeBB) return;
    if (!gameOverBB) {
        bx+=bdx; by+=bdy; if(bx<7||bx>333) bdx=-bdx; if(by<7) bdy=-bdy;
        if(by>343 && by<351 && bx>bpX && bx<bpX+80) { 
            bdy=-Math.abs(bdy); 
            let hitPoint = (bx - (bpX + 40)) / 40; bdx = hitPoint * 4.0; 
            scoreBB++; 
        }
        if(by>380) gameOverBB=true;
        for(let i=0; i<6; i++){
            for(let j=0; j<4; j++){
                if(bricks[i][j]===1){
                    let x=i*50+20, y=j*22+50;
                    if(bx>x && bx<x+45 && by>y && by<y+18) { bdy=-bdy; bricks[i][j]=0; scoreBB+=20; break; }
                }
            }
        }
    }
    
    bCtx.clearRect(0,0,340,380); bCtx.fillStyle="#0a84ff"; bCtx.fillRect(bpX, 350, 80, 10);
    bCtx.fillStyle="#ffcc00"; bCtx.beginPath(); bCtx.arc(bx,by,7,0,Math.PI*2); bCtx.fill();
    for(let i=0; i<6; i++){ for(let j=0; j<4; j++) { if(bricks[i][j]===1){ bCtx.fillStyle="#30d158"; bCtx.fillRect(i*50+20, j*22+50, 45, 18); } } }
    bCtx.fillStyle="#fff"; bCtx.font="bold 13px monospace"; bCtx.fillText("SCORE: "+scoreBB, 15,25);
    if(gameOverBB) { bCtx.fillStyle="rgba(0,0,0,0.85)"; bCtx.fillRect(0,0,340,380); bCtx.fillStyle="#ff3b30"; bCtx.font="bold 18px sans-serif"; bCtx.fillText("GAME OVER", 125, 200); }
    
    requestAnimationFrame(breakerLoop);
}
startBbBtn.addEventListener("click", () => initBreaker());


/* ====================================================================
   🛸 GAME 4: PADDLE JUMPER
   ==================================================================== */
const pCanvas = document.getElementById("puddleCanvas"), pCtx = pCanvas.getContext("2d"), thrustBtn = document.getElementById("btnThrust");
let scorePJ = 0, energyPJ = 100, gameOverPJ = true, pjFrame = 0;
let ship3D = { x: 0, y: 0, rotX: 0, rotY: 0, rotZ: 0 }, targetShip = { x: 0, y: 0, rotX: 0, rotY: 0 };
let star3D = [], objects3D = [];
let isThrusting = false, podExtension = 0.0, pjTouchStart = null;

function initPuddleGame() {
    scorePJ = 0; energyPJ = 100; gameOverPJ = false; activePJ = true; pjFrame = 0; isThrusting = false; podExtension = 0.0;
    ship3D = { x: 0, y: 0, rotX: 0, rotY: 0, rotZ: 0 }; targetShip = { x: 0, y: 0, rotX: 0, rotY: 0 };
    star3D = []; objects3D = [];
    for(let i=0; i<60; i++) star3D.push({ x: (Math.random()-0.5)*1200, y: (Math.random()-0.5)*1200, z: Math.random()*800 + 50, s: Math.random()*2+1 });
    spawnPJObject('stargate', 0, 0, 700);
    requestAnimationFrame(puddleLoop);
}
function spawnPJObject(type, x, y, z) { objects3D.push({ type: type, x: x, y: y, z: z, r: type==='stargate'? 85 : 25 }); }

pCanvas.addEventListener("touchstart", (e) => {
    if(!activePJ || gameOverPJ) return;
    let t = e.touches[0]; pjTouchStart = { x: t.clientX, y: t.clientY, baseShipX: ship3D.x, baseShipY: ship3D.y };
}, {passive:true});
pCanvas.addEventListener("touchmove", (e) => {
    if(!activePJ || gameOverPJ || !pjTouchStart) return;
    let t = e.touches[0], dx = t.clientX - pjTouchStart.x, dy = t.clientY - pjTouchStart.y;
    targetShip.x = Math.max(-130, Math.min(130, pjTouchStart.baseShipX + dx * 1.2));
    targetShip.y = Math.max(-95, Math.min(95, pjTouchStart.baseShipY + dy * 1.2));
    targetShip.rotZ = dx * 0.005; targetShip.rotX = dy * 0.005;
}, {passive:true});
pCanvas.addEventListener("touchend", () => { targetShip.rotZ = 0; targetShip.rotX = 0; pjTouchStart = null; });

if(thrustBtn) {
    thrustBtn.addEventListener("click", () => { if(!gameOverPJ) isThrusting = !isThrusting; });
}
function project(x, y, z, cx, cy) { let fov = 220; if(z <= 0) z = 1; return { x: (x / z) * fov + cx, y: (y / z) * fov + cy, scale: fov / z }; }

function puddleLoop() {
    if (!activePJ) return;
    if (!gameOverPJ) {
        pjFrame++;
        ship3D.x += (targetShip.x - ship3D.x) * 0.12; ship3D.y += (targetShip.y - ship3D.y) * 0.12;
        ship3D.rotZ += ((targetShip.rotZ || 0) - ship3D.rotZ) * 0.1; ship3D.rotX += ((targetShip.rotX || 0) - ship3D.rotX) * 0.1;
        podExtension += ((isThrusting ? 1.0 : 0.0) - podExtension) * 0.15;
        
        let speed = isThrusting ? 16.0 : 6.5, camX = ship3D.x * 0.045, camY = ship3D.y * 0.045;
        energyPJ -= isThrusting ? 0.25 : 0.06;

        star3D.forEach(s => { s.z -= speed; s.x -= camX; s.y -= camY; if(s.z <= 10) { s.x = (Math.random()-0.5)*1200; s.y = (Math.random()-0.5)*1200; s.z = 800; } });
        
        for(let i=objects3D.length-1; i>=0; i--) {
            let o = objects3D[i]; o.z -= speed; o.x -= camX; o.y -= camY;
            if(o.z <= 35 && o.z > 0) {
                let dist = Math.hypot(o.x - ship3D.x, o.y - ship3D.y);
                if(dist < o.r + 15) {
                    if(o.type === 'stargate') { 
                        scorePJ += 1000; 
                        energyPJ = Math.min(100, energyPJ + 25); 
                    } else { 
                        energyPJ -= 30; 
                    }
                    objects3D.splice(i,1);
                }
            } else if(o.z <= 0) objects3D.splice(i,1);
        }
        if(objects3D.length < 4) spawnPJObject(Math.random()>0.35?'debris':'stargate', (Math.random()-0.5)*320, (Math.random()-0.5)*320, 800);
        if(energyPJ <= 0) { energyPJ = 0; gameOverPJ = true; isThrusting = false; }
    }
    
    pCtx.clearRect(0, 0, 340, 370); let cx = 170, cy = 185;
    pCtx.fillStyle = "rgba(255, 255, 255, 0.8)";
    star3D.forEach(s => { let pt = project(s.x, s.y, s.z, cx, cy); if(pt.x >= 0 && pt.x <= 340 && pt.y >= 0 && pt.y <= 370) pCtx.fillRect(pt.x, pt.y, s.s, s.s); });
    objects3D.forEach(o => {
        let pt = project(o.x, o.y, o.z, cx, cy); let sz = o.r * pt.scale * 0.5;
        if(o.type === 'stargate') {
            pCtx.strokeStyle = "#30d158"; pCtx.lineWidth = 3; pCtx.beginPath(); pCtx.arc(pt.x, pt.y, sz, 0, Math.PI*2); pCtx.stroke();
        } else {
            pCtx.fillStyle = "#8e8e93"; pCtx.fillRect(pt.x-sz/2, pt.y-sz/2, sz, sz);
        }
    });
    drawStargateJumper(cx, cy);
    pCtx.fillStyle = "#30d158"; pCtx.font = "bold 13px monospace"; pCtx.fillText("ENERGY: " + Math.ceil(energyPJ) + "%", 15, 25);
    pCtx.fillText("SCORE: " + scorePJ, 240, 25);
    if(gameOverPJ) { pCtx.fillStyle = "rgba(5,7,12,0.92)"; pCtx.fillRect(0,0,340,370); pCtx.font = "bold 16px sans-serif"; pCtx.fillStyle = "#ff3b30"; pCtx.fillText("SYSTEM CRITICAL / GAME OVER", 50, 185); }
    
    requestAnimationFrame(puddleLoop);
}
function drawStargateJumper(cx, cy) {
    let pt = project(ship3D.x, ship3D.y + 12, 35, cx, cy); let scale = pt.scale * 0.42;
    pCtx.save(); pCtx.translate(pt.x, pt.y); pCtx.rotate(ship3D.rotZ);
    pCtx.fillStyle = "#0a84ff"; pCtx.fillRect(-20*scale, -10*scale, 40*scale, 20*scale);
    let ext = podExtension * 9 * scale; pCtx.fillStyle = "#5e5ce6"; pCtx.fillRect(-28*scale-ext, -5*scale, 8*scale, 10*scale); pCtx.fillRect(20*scale+ext, -5*scale, 8*scale, 10*scale);
    pCtx.restore();
}


/* ====================================================================
   🎧 オーディオプレイヤーコア制御 & 隠しコード
   ==================================================================== */
const picker = document.getElementById("picker"), player = document.getElementById("player"), statusEl = document.getElementById("status");
const playBtn = document.getElementById("playBtn"), seekbarProgress = document.getElementById("seekbarProgress"), seekbarHandle = document.getElementById("seekbarHandle");
const currentTimeEl = document.getElementById("currentTime"), durationTimeEl = document.getElementById("durationTime"), seekTouch = document.getElementById("seekbarTouchZone");
let currentUrl = null;

if(picker) {
    picker.addEventListener("change", () => {
        const file = picker.files[0]; if(!file) return;
        if(currentUrl) URL.revokeObjectURL(currentUrl); currentUrl = URL.createObjectURL(file);
        player.src = currentUrl; player.load(); statusEl.textContent = file.name.toUpperCase();
        player.addEventListener("loadedmetadata", () => { durationTimeEl.textContent = formatTime(player.duration); }, {once:true});
    });
}
if(playBtn) {
    playBtn.addEventListener("click", () => { if(!player.src) return; if(player.paused) { player.play(); playBtn.textContent = "PAUSE"; } else { player.pause(); playBtn.textContent = "PLAY"; } });
}
function formatTime(s) { if(isNaN(s)) return "00:00"; let m=Math.floor(s/60), sec=Math.floor(s%60); return String(m).padStart(2,'0')+":"+String(sec).padStart(2,'0'); }
if(player) {
    player.addEventListener("timeupdate", () => { currentTimeEl.textContent = formatTime(player.currentTime); let pct = (player.currentTime/player.duration)*100; if(!isNaN(pct)){ seekbarProgress.style.width = pct+"%"; seekbarHandle.style.left = pct+"%"; } });
}
if(seekTouch) {
    seekTouch.addEventListener("click", (e) => { if(!player.src || isNaN(player.duration)) return; const r = seekTouch.getBoundingClientRect(); player.currentTime = ((e.clientX - r.left) / r.width) * player.duration; });
}

// 🔒 隠しコード
const secretInput = document.getElementById("secretCodeInput"), secretBtn = document.getElementById("secretCodeBtn");
function checkSecretCode() {
    if (secretInput.value.trim() === "Rodney-Private") {
        player.src = "Insane slowed.wav"; player.load(); statusEl.textContent = "🔒 INSANE SLOWED.WAV LOADED";
        player.addEventListener("loadedmetadata", () => { durationTimeEl.textContent = formatTime(player.duration); }, {once:true});
        secretInput.value = ""; alert("隠しトラックをロードしました！"); closeMenu();
    }
}
if(secretBtn) secretBtn.addEventListener("click", checkSecretCode);
if(secretInput) secretInput.addEventListener("keydown", (e) => { if(e.key === 'Enter') { e.preventDefault(); checkSecretCode(); } });
</script>
